name: Deploy a PROD site

# One PROD site's deploy over SSH, called by deploy.yml (jobs deploy-pemogan
# and deploy-citarum); never run on its own. See deploy/server/README.md.
#
#   - Runs in the site's environment, prod-<site>: it waits for the required
#     reviewer's approval, only runs from the production branch, and holds
#     the PROD key and server secrets.
#   - After approval, before anything else: outside office hours only
#     (08:00-17:59 WITA, Asia/Makassar, is refused; nothing is changed).
#   - Deploys exactly the commit it is given (the sha the Tests run passed,
#     or the tip of production for a manual run), never "whatever production
#     is now".
#   - Shares its concurrency group (deploy-<site>) with Rollback, so a deploy
#     and a rollback of one site never overlap; a running one is never
#     cancelled.

on:
  workflow_call:
    inputs:
      site:
        description: Site name, as in sites.allow.prod on the server (pemogan, citarum)
        type: string
        required: true
      domain:
        description: The site's domain, for the summary
        type: string
        required: true
      sha:
        description: Full commit sha to deploy (a commit on production)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod-${{ inputs.site }}
    concurrency:
      group: deploy-${{ inputs.site }}
      cancel-in-progress: false

    steps:
      - name: Outside office hours only (WITA)
        run: |
          set -euo pipefail
          now="$(TZ=Asia/Makassar date '+%H:%M')"
          hour=$((10#${now%%:*}))
          if [ "$hour" -ge 8 ] && [ "$hour" -lt 18 ]; then
            echo "::error::Office hours: re-run this after 18:00 WITA (it is $now WITA now). Nothing was changed."
            {
              echo "### Deploy to ${{ inputs.site }}"
              echo
              echo "⏸️ Office hours: re-run this after 18:00 WITA (it was $now WITA). Nothing was changed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "It is $now WITA: outside office hours, going on."

      - name: Check out the commit to deploy
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Check the commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), not the commit to deploy ($SHA). Nothing was changed."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/production; then
            echo "::error::$SHA is not on the production branch. Nothing was changed."
            exit 1
          fi

      - name: Build the release
        id: build
        run: |
          set -euo pipefail
          bash deploy/build-release.sh HEAD "$RUNNER_TEMP/release.tar.gz"
          echo "release_id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_ID: ${{ steps.build.outputs.release_id }}
          SITE: ${{ inputs.site }}
        run: |
          set -euo pipefail
          for name in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the 'prod-$SITE' environment."
              exit 1
            fi
          done

          ssh_dir="$RUNNER_TEMP/ssh"
          install -m 700 -d "$ssh_dir"
          # tr: values pasted from Windows may carry CR characters, which
          # make ssh reject the key ("invalid format").
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          # The host key is pinned (DEPLOY_KNOWN_HOSTS). The PROD key is
          # forced to "gate.sh prod", which only accepts the sites in
          # sites.allow.prod whose ci_env is production.
          ssh -i "$ssh_dir/key" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $SITE $RELEASE_ID" \
            < "$RUNNER_TEMP/release.tar.gz" 2>&1 | tee "$RUNNER_TEMP/deploy-output.txt"

      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

      - name: Job summary
        if: always() && steps.build.outcome == 'success'
        env:
          RELEASE_ID: ${{ steps.build.outputs.release_id }}
          SHA: ${{ steps.build.outputs.sha }}
          VERSION: ${{ steps.build.outputs.version }}
          SITE: ${{ inputs.site }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -uo pipefail
          line="$(grep '^RESULT ' "$RUNNER_TEMP/deploy-output.txt" 2>/dev/null | tail -n1)"
          field() { printf '%s\n' "$line" | tr ' ' '\n' | sed -n "s/^$1=//p"; }
          result="$(field result)"; backup="$(field backup)"
          case "$result" in
            success) shown="✅ deployed" ;;
            already-live) shown="✅ already live, nothing changed" ;;
            rolled-back) shown="↩️ failed, rolled back (previous release live)" ;;
            rollback-incomplete) shown="🛑 failed, rollback incomplete: maintenance left on, see deploy/server/README.md" ;;
            failed) shown="❌ failed before anything changed" ;;
            *) shown="❌ no result from the server (see the Deploy step's log)" ;;
          esac
          {
            echo "### Deploy to $SITE"
            echo
            echo "| Site | Version | Commit | Release | Backup | Result |"
            echo "| --- | --- | --- | --- | --- | --- |"
            echo "| $SITE ($DOMAIN) | $VERSION | \`${SHA:0:12}\` | \`$RELEASE_ID\` | ${backup:+\`$backup\`} | $shown |"
            echo
            echo "Server logs: \`~/domains/$DOMAIN/deploy/logs/\` (deploy.log and history.log)."
          } >> "$GITHUB_STEP_SUMMARY"
