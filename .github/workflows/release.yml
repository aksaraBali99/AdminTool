name: Release

# A release is a PR from main into production that bumps VERSION.
#   - On that PR: check VERSION is valid semver and higher than the last tag.
#   - On merge (push to production): tag v<VERSION> and publish a GitHub
#     Release whose notes list the PRs merged since the previous release.
# See docs/RELEASING.md.

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: VERSION must be higher than the latest release tag
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must look like 1.2.3, got '$version'"
            exit 1
          fi
          latest="$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -n1)"
          if [ -z "$latest" ]; then
            echo "No release tags yet; $version will be the first release."
            exit 0
          fi
          highest="$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)"
          if [ "$version" = "$latest" ] || [ "$highest" != "$version" ]; then
            echo "::error file=VERSION::VERSION ($version) must be higher than the latest release (v$latest). Bump it in this PR."
            exit 1
          fi
          echo "Releasing v$version (previous: v$latest)."

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error file=VERSION::$tag already exists. This push to production did not bump VERSION."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
