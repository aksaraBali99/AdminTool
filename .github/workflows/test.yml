name: Tests

on:
  push:
  pull_request:

# The CI database is built by running the app's own migrations
# (application/migrations/, via `php index.php migrate`), the same path
# DEV/PROD schema changes take - so a schema change shipped without a
# migration fails here. tests/fixtures/seed_test_data.sql only INSERTs into
# tables the migrations have already created.
env:
  TEST_DB_HOST: 127.0.0.1
  TEST_DB_PORT: 3306
  TEST_DB_USER: root
  TEST_DB_PASS: root

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admintool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, dom, gd, mysqli, zip, xml
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist

      - name: Build the empty CI database by running migrations
        run: php index.php migrate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: admintool_test
          CI_ENV: testing

      - name: Run PHPUnit suite (tests/run-tests.sh reseeds fixture data itself)
        run: composer test

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: admintool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, dom, gd, mysqli, zip, xml
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist

      - name: Build the empty CI database by running migrations
        run: php index.php migrate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: admintool_test
          CI_ENV: testing

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - working-directory: e2e
        run: npm ci

      - name: Install Playwright's browser (Chromium only - it's all this suite uses)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite (tests/serve-test-app.sh reseeds fixture data itself)
        working-directory: e2e
        run: npx playwright test

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
